<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">Conceptual seven-system refill architecture: two finite reservoirs, three- and four-outlet manifolds, quick-disconnect tubing, and local float valves. Six frames were included in the endurance trial; the seventh was under repair.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><style>.label{fill:#e8e6e3;font:500 20px sans-serif}.sub{fill:#aaa7b1;font:16px sans-serif}.note{fill:#f47c72;font:14px monospace;letter-spacing:2px}</style><rect width="760" height="320" fill="#111114"/><rect width="760" height="320" fill="url(#grid)"/><text x="25" y="28" class="note">FINITE SUPPLY / SEVEN-SYSTEM CAPACITY</text><g fill="none" stroke="#f47c72" stroke-width="2"><path d="M230 100H260V171H285 M230 240H260V171 M490 171H520 M520 31V283"/><path d="M520 31H555"/><path d="M520 73H555"/><path d="M520 115H555"/><path d="M520 157H555"/><path d="M520 199H555"/><path d="M520 241H555"/><path d="M520 283H555"/></g><rect x="25" y="65" width="205" height="70" rx="5" fill="#18181c" stroke="#55545d"/><text x="127.5" y="97.0" text-anchor="middle" class="label">Reservoir 1</text><text x="127.5" y="122.0" text-anchor="middle" class="sub">Finite water supply</text><rect x="25" y="205" width="205" height="70" rx="5" fill="#18181c" stroke="#55545d"/><text x="127.5" y="237.0" text-anchor="middle" class="label">Reservoir 2</text><text x="127.5" y="262.0" text-anchor="middle" class="sub">Finite water supply</text><rect x="285" y="126" width="205" height="90" rx="5" fill="#18181c" stroke="#55545d"/><text x="387.5" y="168.0" text-anchor="middle" class="label">Manifolds</text><text x="387.5" y="193.0" text-anchor="middle" class="sub">3 + 4 outlets</text><rect x="555" y="15" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="38.0" text-anchor="middle" class="label">System 1</text><rect x="555" y="57" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="80.0" text-anchor="middle" class="label">System 2</text><rect x="555" y="99" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="122.0" text-anchor="middle" class="label">System 3</text><rect x="555" y="141" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="164.0" text-anchor="middle" class="label">System 4</text><rect x="555" y="183" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="206.0" text-anchor="middle" class="label">System 5</text><rect x="555" y="225" width="180" height="32" rx="5" fill="#18181c" stroke="#55545d"/><text x="645.0" y="248.0" text-anchor="middle" class="label">System 6</text><rect x="555" y="267" width="180" height="32" rx="5" fill="#111114" stroke="#77747e" stroke-dasharray="5 4"/><text x="645" y="288" text-anchor="middle" class="sub">7 · not in trial</text></svg>
