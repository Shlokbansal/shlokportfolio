<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">Conceptual relationship between Arduino control, motor-driven positioning, a test fixture, and sensor observations.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><style>.label{fill:#e8e6e3;font:500 20px sans-serif}.sub{fill:#aaa7b1;font:16px sans-serif}.note{fill:#f47c72;font:14px monospace;letter-spacing:2px}</style><rect width="760" height="320" fill="#111114"/><rect width="760" height="320" fill="url(#grid)"/><rect x="35" y="67" width="200" height="92" rx="6" fill="#18181c" stroke="#55545d"/><text x="135.0" y="110.0" text-anchor="middle" class="label">Arduino</text><text x="135.0" y="135.0" text-anchor="middle" class="sub">Control</text><rect x="280" y="67" width="200" height="92" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="110.0" text-anchor="middle" class="label">Motors</text><text x="380.0" y="135.0" text-anchor="middle" class="sub">Positioning</text><rect x="525" y="67" width="200" height="92" rx="6" fill="#18181c" stroke="#55545d"/><text x="625.0" y="110.0" text-anchor="middle" class="label">Fixture</text><text x="625.0" y="135.0" text-anchor="middle" class="sub">Test setup</text><path d="M235 113H280 M480 113H525" fill="none" stroke="#f47c72" stroke-width="2"/><rect x="280" y="219" width="200" height="64" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="257.0" text-anchor="middle" class="label">Sensor observations</text><path d="M625 159V251H480 M280 251H135V159" fill="none" stroke="#77747e" stroke-width="2"/><text x="35" y="30" class="note">MOTION + MEASUREMENT</text></svg>