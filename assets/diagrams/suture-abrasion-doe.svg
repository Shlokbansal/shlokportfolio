<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">Conceptual characterization workflow: four study factors, a 36-run cyclic abrasion DOE, pre/post imaging, tensile testing, and Minitab ANOVA.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><style>.label{fill:#e8e6e3;font:500 20px sans-serif}.sub{fill:#aaa7b1;font:16px sans-serif}.note{fill:#f47c72;font:14px monospace;letter-spacing:2px}</style><rect width="760" height="320" fill="#111114"/><rect width="760" height="320" fill="url(#grid)"/><text x="35" y="30" class="note">CHARACTERIZATION / CONTROLLED FACTORS</text><rect x="35" y="65" width="200" height="90" rx="6" fill="#18181c" stroke="#55545d"/><text x="135.0" y="107.0" text-anchor="middle" class="label">Study factors</text><text x="135.0" y="132.0" text-anchor="middle" class="sub">Material / loading</text><rect x="280" y="65" width="200" height="90" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="107.0" text-anchor="middle" class="label">36-run DOE</text><text x="380.0" y="132.0" text-anchor="middle" class="sub">Cyclic abrasion</text><rect x="525" y="65" width="200" height="90" rx="6" fill="#18181c" stroke="#55545d"/><text x="625.0" y="107.0" text-anchor="middle" class="label">Imaging + tensile</text><text x="625.0" y="132.0" text-anchor="middle" class="sub">Pre/post assessment</text><rect x="240" y="220" width="280" height="75" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="254.5" text-anchor="middle" class="label">Minitab ANOVA</text><text x="380.0" y="279.5" text-anchor="middle" class="sub">Engineering summaries</text><text x="135" y="186" text-anchor="middle" class="sub">Type · load · travel · rate</text><path d="M235 110H280 M480 110H525 M625 155V257H520" fill="none" stroke="#f47c72" stroke-width="2"/></svg>
