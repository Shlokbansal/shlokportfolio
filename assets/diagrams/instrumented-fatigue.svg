<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">Conceptual instrumented benchtop system with heated circulation, PID regulation, fixture interfaces, pressure measurement, and an initial functional dry run.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><style>.label{fill:#e8e6e3;font:500 20px sans-serif}.sub{fill:#aaa7b1;font:16px sans-serif}.note{fill:#f47c72;font:14px monospace;letter-spacing:2px}</style><rect width="760" height="320" fill="#111114"/><rect width="760" height="320" fill="url(#grid)"/><text x="35" y="30" class="note">BUILD / INTEGRATE / COMMISSION</text><rect x="35" y="64" width="200" height="86" rx="6" fill="#18181c" stroke="#55545d"/><text x="135.0" y="104.0" text-anchor="middle" class="label">Heated circulation</text><text x="135.0" y="129.0" text-anchor="middle" class="sub">PID temperature</text><rect x="280" y="64" width="200" height="86" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="104.0" text-anchor="middle" class="label">Fixture interface</text><text x="380.0" y="129.0" text-anchor="middle" class="sub">Mechanical loading</text><rect x="525" y="64" width="200" height="86" rx="6" fill="#18181c" stroke="#55545d"/><text x="625.0" y="104.0" text-anchor="middle" class="label">Pressure transducer</text><text x="625.0" y="129.0" text-anchor="middle" class="sub">Signal conditioning</text><rect x="180" y="218" width="400" height="78" rx="6" fill="#18181c" stroke="#55545d"/><text x="380.0" y="254.0" text-anchor="middle" class="label">Integrated system dry run</text><text x="380.0" y="279.0" text-anchor="middle" class="sub">Enclosure / fixtures / measurement</text><path d="M235 107H280 M480 107H525 M380 150V218 M625 150V257H580" fill="none" stroke="#f47c72" stroke-width="2"/></svg>
